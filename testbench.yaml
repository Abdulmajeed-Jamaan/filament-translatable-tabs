laravel: '@testbench'

providers:
  - Workbench\App\Providers\Filament\AdminPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: false
    api: false
    commands: false
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - filament:assets
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
