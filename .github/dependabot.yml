# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: widen
    ignore:
      # A new Filament major gets its own branch
      - dependency-name: "filament/*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "4.x"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"

  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "4.x"
    schedule:
      interval: "weekly"
    versioning-strategy: widen
    ignore:
      # Maintenance branch: minor and patch updates only
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
